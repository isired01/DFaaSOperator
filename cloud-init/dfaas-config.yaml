#cloud-config
# Example cloud-init for a VM the operator can provision: a sudo user with SSH
# password authentication. Set your own user and password, and put the same pair
# in spec.nodes[].username and spec.nodes[].password of the Environment.
ssh_pwauth: true
chpasswd:
  list: |
    ubuntu:CHANGE_ME
  expire: False

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

package_update: true
packages:
  - openssh-server
  - python3

runcmd:
  - sed -i 's/^#*PasswordAuthentication no/PasswordAuthentication yes/'
    /etc/ssh/sshd_config
  - systemctl restart ssh
