# Override values for the grafana/grafana chart.
# PoC: no PVC, admin/admin credentials, Prometheus datasource
# pre-configured pointing at the "prometheus" release in the monitoring namespace.

persistence:
  enabled: false

adminUser: admin
adminPassword: admin

service:
  type: NodePort
  nodePort: 30300

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        # The port is not optional: prometheus-values.yaml sets
        # server.service.servicePort to 9090, so without it Grafana queries
        # port 80 and every panel is empty with no error on the panel itself --
        # only the datasource health check says "i/o timeout". Pinned against
        # that file by datasource_test.go.
        url: http://prometheus-server.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true

# File-based dashboard provisioning. Grafana runs without a PVC, so anything
# created through its API or UI is lost at the next restart; a provider reading
# from a mounted ConfigMap rebuilds the dashboards on every start. The provider
# name "dfaas" must match the key Deploy() writes under `dashboards`.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: dfaas
        orgId: 1
        folder: dFaaS
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/dfaas

# Grafana needs no cluster-scoped read here (every sidecar is off), and the
# operator ServiceAccount cannot create ClusterRoles anyway. `namespaced: true`
# drops the chart's ClusterRole + ClusterRoleBinding and keeps only the
# namespaced Role/RoleBinding, which renders with empty rules.
rbac:
  namespaced: true
