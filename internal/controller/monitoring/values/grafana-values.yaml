# Override values for the grafana/grafana chart.
# PoC: no PVC, admin/admin credentials, Prometheus datasource
# pre-configured pointing at the "prometheus" release in the monitoring namespace.

persistence:
  enabled: false

adminUser: admin
adminPassword: admin

service:
  type: NodePort
  nodePort: 30300

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
