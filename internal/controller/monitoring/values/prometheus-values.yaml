# Override values for the prometheus-community/prometheus chart.
# Minimizes the install: Prometheus server with configmap-reload sidecar, no
# node-exporter, alertmanager, kube-state-metrics, pushgateway.

alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-pushgateway:
  enabled: false

# configmap-reload sidecar (bundled with the chart). Watches the ConfigMap
# mounts and calls POST http://localhost:9090/-/reload when the filesystem
# changes → hot-reload without restarting the pod.
configmapReload:
  prometheus:
    enabled: true
    # Extends the watch to the file-based service-discovery dir:
    # when the operator updates the prometheus-targets ConfigMap, the mounted
    # JSON file changes and the reloader notifies Prometheus.
    extraVolumeMounts:
      - name: dfaas-targets
        mountPath: /etc/prometheus/file_sd

server:
  fullnameOverride: "prometheus-server"
  global:
    # How often the management Prometheus federates every worker. The chart
    # default is 1m, which on a five-minute load test gives five points per
    # series -- a dashboard that moves once a minute, and a CSV whose shape
    # depends on where the run fell in the cycle. 15s is four points a minute
    # and still leaves the chart's 10s scrape_timeout valid.
    #
    # It is pinned against federationInterval in
    # internal/controller/loadtest_observe.go by a test: the export cool-down
    # derives from this number, so the two move together or the CSV loses its
    # tail again.
    scrape_interval: 15s
  # The operator ServiceAccount deliberately has no clusterroles/clusterrolebindings
  # verbs, so it cannot let this chart create its own cluster-scoped RBAC. The dfaas
  # chart ships that ClusterRole + ClusterRoleBinding instead
  # (charts/dfaas/templates/monitoring-rbac.yaml) and this name must match the one
  # declared there. Setting it also suppresses the chart own ClusterRoleBinding.
  useExistingClusterRoleName: dfaas-prometheus-server
  # Past runs have to outlive the pod: with an emptyDir and 1d of retention,
  # a restart or a night was enough to make a finished test unreviewable in
  # Grafana, and the exported CSVs are the analysis path, not the dashboard.
  # The federation below pulls every series of every worker, so 7d can fill
  # 20Gi sooner than expected — Prometheus then drops its oldest blocks on its
  # own; raise the size rather than the retention if that starts to bite.
  persistentVolume:
    enabled: true
    size: 20Gi
  retention: "7d"
  service:
    type: NodePort
    servicePort: 9090
    nodePort: 30090
  # Mounts the prometheus-targets ConfigMap managed by the operator
  # (reconcilePrometheusTargets). `optional: true` avoids errors if the
  # ConfigMap does not exist on the first deploy.
  extraVolumes:
    - name: dfaas-targets
      configMap:
        name: prometheus-targets
        optional: true
  extraVolumeMounts:
    - name: dfaas-targets
      mountPath: /etc/prometheus/file_sd

# Appended to the base scrape_configs: the dfaas-nodes job federates all
# metrics from the worker's local Prometheus (cAdvisor, node-exporter,
# openfaas, …). File-based SD: targets live in
# /etc/prometheus/file_sd/*.json (see monitoring/targets.go).
# Chart 29.x reads this key at top level (not under server.).
extraScrapeConfigs: |
  - job_name: 'dfaas-nodes'
    honor_labels: true
    metrics_path: /federate
    params:
      'match[]':
        - '{job!=""}'
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.json
        refresh_interval: 30s
