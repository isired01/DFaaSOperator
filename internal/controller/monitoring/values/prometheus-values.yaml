# Override values for the prometheus-community/prometheus chart.
# Minimizes the install: Prometheus server with configmap-reload sidecar, no
# node-exporter, alertmanager, kube-state-metrics, pushgateway.

alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-pushgateway:
  enabled: false

# configmap-reload sidecar (bundled with the chart). It watches only
# /etc/config, the chart's own prometheus.yml, and calls
# POST http://localhost:9090/-/reload when that file changes: a change to the
# Prometheus config (the retention block below included) never restarts the
# pod. The file_sd mount below is inert, since without extraVolumeDirs the
# sidecar does not watch it; Prometheus picks up the operator's target files
# on its own (file_sd watches the directory, refresh_interval is the fallback).
# ponytail: drop this mount with the next change that restarts the pod anyway;
# removing it on its own would restart the shared Prometheus for nothing.
configmapReload:
  prometheus:
    enabled: true
    extraVolumeMounts:
      - name: dfaas-targets
        mountPath: /etc/prometheus/file_sd

server:
  fullnameOverride: "prometheus-server"
  global:
    # How often the management Prometheus federates every worker. The chart
    # default is 1m, which on a five-minute load test gives five points per
    # series -- a dashboard that moves once a minute, and a CSV whose shape
    # depends on where the run fell in the cycle. 10s is six points a minute.
    #
    # This line is the only place the interval is set: the operator reads it
    # from the embedded file (monitoring.FederationInterval) and widens the
    # export window by one interval. Two tests bound it: the one-minute export
    # cool-down must cover two intervals (federation_interval_test.go), and the
    # interval cannot go below the chart's 10s scrape_timeout
    # (prometheus_values_test.go). A new value reaches the running Prometheus
    # at the next Environment provisioning, when Deploy upgrades the release.
    scrape_interval: 10s
  # The operator ServiceAccount deliberately has no clusterroles/clusterrolebindings
  # verbs, so it cannot let this chart create its own cluster-scoped RBAC. The dfaas
  # chart ships that ClusterRole + ClusterRoleBinding instead
  # (charts/dfaas/templates/monitoring-rbac.yaml) and this name must match the one
  # declared there. Setting it also suppresses the chart own ClusterRoleBinding.
  useExistingClusterRoleName: dfaas-prometheus-server
  # Past runs have to outlive the pod: with an emptyDir and 1d of retention,
  # a restart or a night was enough to make a finished test unreviewable in
  # Grafana, and the exported CSVs are the analysis path, not the dashboard.
  # The federation below pulls every series of every worker, so 7d can fill
  # 20Gi. The size limit in tsdb.retention makes Prometheus delete its oldest
  # blocks first instead of failing writes on a full volume. It lives in
  # prometheus.yml, which the sidecar hot-reloads, so changing it never
  # restarts Prometheus; server.retention stays because removing the flag
  # brings back the chart default as a flag, which does. tsdb.retention.time
  # repeats 7d because a retention block without time disables time-based
  # retention. 16GB is 16GiB, 80% of the volume: the size counts the WAL and
  # head chunks, and compaction needs room for a temporary block.
  persistentVolume:
    enabled: true
    size: 20Gi
  retention: "7d"
  tsdb:
    retention:
      time: 7d
      size: 16GB
  service:
    type: NodePort
    servicePort: 9090
    nodePort: 30090
  # Mounts the prometheus-targets ConfigMap managed by the operator
  # (monitoring.Manager.ReconcileTargets), keyed one file per Environment as
  # "<namespace>_<name>.json". `optional: true` avoids errors if the
  # ConfigMap does not exist on the first deploy.
  extraVolumes:
    - name: dfaas-targets
      configMap:
        name: prometheus-targets
        optional: true
  extraVolumeMounts:
    - name: dfaas-targets
      mountPath: /etc/prometheus/file_sd

# Appended to the base scrape_configs: the dfaas-nodes job federates all
# metrics from the worker's local Prometheus (cAdvisor, node-exporter,
# openfaas, …). File-based SD: targets live in
# /etc/prometheus/file_sd/*.json (see monitoring/targets.go).
# Chart 29.x reads this key at top level (not under server.).
extraScrapeConfigs: |
  - job_name: 'dfaas-nodes'
    honor_labels: true
    metrics_path: /federate
    params:
      'match[]':
        - '{job!=""}'
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.json
        refresh_interval: 30s
