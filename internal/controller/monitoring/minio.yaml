apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: monitoring
type: Opaque
stringData:
  # In-cluster default S3 sink credentials. These MUST match the values written
  # into the dfaas-s3/minio-default Secret by EnsureDefaultS3Config so the
  # exporter Job can authenticate against this MinIO instance. Change both
  # together if you rotate them.
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "admin123"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-deployment
  namespace: monitoring
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-03-07T00-43-48Z
          args:
            - server
            - /data
            # Console UI on 9001 — MUST NOT be 9090 (Prometheus owns 9090).
            - --console-address
            - ":9001"
          ports:
            # S3 API.
            - containerPort: 9000
              name: api
            # Console UI.
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-storage
              mountPath: /data
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: monitoring
  labels:
    app: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    # API: resolves in-cluster as minio.monitoring.svc.cluster.local:9000.
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30900
    # Console UI.
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
