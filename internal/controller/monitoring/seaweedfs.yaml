apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-creds
  namespace: monitoring
type: Opaque
stringData:
  # SeaweedFS S3 identity config (-s3.config). Defines the single admin identity
  # the gateway and exporter authenticate with. The accessKey/secretKey MUST
  # match the access_key_id/secret_access_key written into the
  # dfaas-s3/seaweedfs-default Secret by EnsureDefaultS3Config so the exporter
  # Job and UI gateway can authenticate against this SeaweedFS instance. Change
  # both together if you rotate them.
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            { "accessKey": "admin", "secretKey": "admin123" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-deployment
  namespace: monitoring
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.34
          # All-in-one: master + volume + filer + S3 gateway in one process.
          # -dir=/data persists master/volume/filer metadata + object data on the
          # PVC. -s3 enables the S3 gateway on 8333 (the only port we expose);
          # -s3.config points at the mounted identity config (admin/admin123).
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            # S3 API.
            - containerPort: 8333
              name: s3
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: seaweedfs-storage
              mountPath: /data
            - name: seaweedfs-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: seaweedfs-storage
          persistentVolumeClaim:
            claimName: seaweedfs-pvc
        - name: seaweedfs-config
          secret:
            secretName: seaweedfs-creds
            items:
              - key: s3.json
                path: s3.json
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: monitoring
  labels:
    app: seaweedfs
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
    # S3 API: resolves in-cluster as seaweedfs.monitoring.svc.cluster.local:8333,
    # reachable from remote k6 VMs / out-of-cluster gateway via <nodeIP>:30900.
    - name: s3
      port: 8333
      targetPort: 8333
      nodePort: 30900
