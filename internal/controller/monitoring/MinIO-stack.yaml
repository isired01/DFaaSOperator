apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate # Necessario per i volumi su singola istanza
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001" # Porta per l'interfaccia web
          # ... dentro il Deployment di MinIO ...
          env:
            - name: MINIO_ROOT_USER
              value: "admin" # 5 caratteri (OK)
            - name: MINIO_ROOT_PASSWORD
              value: "password123" # 11 caratteri (OK)
          ports:
            - containerPort: 9000 # Porta API (S3)
            - containerPort: 9001 # Porta Console
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
      nodePort: 31090 # Porta per caricare i file dal codice Go
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 31091 # Accedi via browser a http://IP-VM:31091
