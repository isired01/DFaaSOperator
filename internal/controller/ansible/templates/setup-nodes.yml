---
- name: "Setup DFaaS Node"
  hosts: target_nodes
  become: true
  collections:
    - mschuchard.general
    - kubernetes.core
    - community.general
  vars:
    openfaas_url: "http://127.0.0.1:31112"
    k3s_config: "/etc/rancher/k3s/k3s.yaml"

    # --- Version pins (reproducibility) ---
    # Each defaults to empty = current behavior (install the latest available).
    # Set a value to pin that artifact so two provisioning runs build the
    # identical software stack — recommended for reproducible thesis experiments.
    # These are the single place to pin; edit the operator image / re-provision
    # (spec edit → generation drift) to apply changes.
    # ponytail: latest-by-default keeps existing behavior; pin per your validated versions.
    k3s_version: ""               # e.g. "v1.30.4+k3s1"; empty = latest stable channel
    helm_version: ""              # e.g. "v3.15.4"; empty = latest (get-helm-3)
    haproxy_chart_version: ""     # haproxytech/haproxy; empty = latest
    prometheus_chart_version: ""  # prometheus-community/prometheus; empty = latest
    openfaas_chart_version: ""    # openfaas/openfaas; empty = latest
    # dfaas-agent: the chart is pinned below (chart_version); the workload image
    # tag is the moving part. Pin it to a release tag or digest instead of the
    # mutable :dev for reproducible agent behavior.
    dfaas_agent_image: "ghcr.io/isired01/dfaas-agent:dev"
    dfaas_agent_image_pull_policy: "Always"

  tasks:
    - name: Disable APT automatic upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-disable-auto-upgrades
        content: |
          APT::Periodic::Enable "0";
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Configure sudo env_keep
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-preserve-env
        mode: "0440"
        content: |
          Defaults:%sudo env_keep += "KUBECONFIG"
          Defaults !always_set_home

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name: [buildah, curl, git, python3-pip, python3-kubernetes]
        state: present
        update_cache: true

    - name: Disable UFW firewall
      community.general.ufw:
        state: disabled

    - name: Ensure netfilter modules are loaded
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - nf_conntrack

    - name: Tune Kernel settings
      ansible.builtin.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/20-k3s-custom.conf
        state: present
        reload: true
        ignoreerrors: "{{ true if item.key == 'net.netfilter.nf_conntrack_max' else false }}"
      loop:
        - { key: "net.core.somaxconn", value: "8192" }
        - { key: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
        - { key: "net.ipv4.ip_local_port_range", value: "1024 65535" }
        - { key: "net.ipv4.tcp_tw_reuse", value: "1" }
        - { key: "net.netfilter.nf_conntrack_max", value: "262144" }

    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install K3S (only if missing)
      ansible.builtin.shell:
        cmd: >-
          curl -sfL https://get.k3s.io |
          {{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if k3s_version else '' }}
          INSTALL_K3S_EXEC="--disable traefik --disable servicelb" sh -
      when: not k3s_bin.stat.exists

    - name: Ensure K3s service is started and enabled
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for K3s nodes to be ready
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: "{{ k3s_config }}"
      register: node_list
      until: node_list.resources | length > 0
      retries: 20
      delay: 5

    - name: Check if Helm is installed
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_bin

    - name: Install Helm
      ansible.builtin.shell:
        cmd: >-
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 |
          {{ ('DESIRED_VERSION=' ~ helm_version) if helm_version else '' }} bash
      when: not helm_bin.stat.exists

    - name: Add Helm Repos
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
        # force_update makes this idempotent across re-provisioning. Without it the
        # module hard-fails with "Repository already have a repository named <x>"
        # whenever a repo of that name already exists with even a slightly different
        # URL (a trailing slash is enough). Since this playbook re-runs on every
        # spec edit — the documented update path — the second provisioning run of
        # any Environment died here, before any function change could be applied.
        force_update: true
      loop:
        - { name: "haproxytech", url: "https://haproxytech.github.io/helm-charts" }
        - { name: "prometheus-community", url: "https://prometheus-community.github.io/helm-charts" }
        - { name: "openfaas", url: "https://openfaas.github.io/faas-netes/" }

    - name: Create Namespaces for OpenFaaS
      kubernetes.core.k8s:
        name: "{{ item }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ k3s_config }}"
      loop: [openfaas, openfaas-fn, monitoring, haproxy-controller]
      register: ns_create
      retries: 10
      delay: 6
      until: ns_create is succeeded

    - name: "Create local config directory on nodes"
      ansible.builtin.file:
        path: /opt/dfaas/helm-values
        state: directory
        mode: '0755'

    - name: "Copy Helm values"
      ansible.builtin.copy:
        src: "/opt/helm-values/{{ item }}.yaml"
        dest: "/opt/dfaas/helm-values/{{ item }}.yaml"
      loop: [haproxy, prometheus, openfaas]
      register: helm_values_copy

    - name: Install Helm Charts
      kubernetes.core.helm:
        name: "{{ item.name }}"
        chart_ref: "{{ item.chart }}"
        chart_version: "{{ item.version | default(omit, true) }}"
        release_namespace: "{{ item.ns }}"
        create_namespace: true
        wait: true
        kubeconfig: "{{ k3s_config }}"
        values_files:
          - "/opt/dfaas/helm-values/{{ item.name }}.yaml"
      loop:
        - { name: "haproxy", chart: "haproxytech/haproxy", ns: "haproxy-controller", version: "{{ haproxy_chart_version }}" }
        - { name: "prometheus", chart: "prometheus-community/prometheus", ns: "monitoring", version: "{{ prometheus_chart_version }}" }
        - { name: "openfaas", chart: "openfaas/openfaas", ns: "openfaas", version: "{{ openfaas_chart_version }}" }
      register: helm_install_result
      retries: 5
      delay: 15
      until: helm_install_result is succeeded

    - name: Check if faas-cli is installed
      ansible.builtin.stat:
        path: /usr/local/bin/faas-cli
      register: faas_cli_bin

    - name: Install faas-cli
      ansible.builtin.shell: curl -sSL https://cli.openfaas.com | sh
      when: not faas_cli_bin.stat.exists

    # Helm's `wait: true` only blocks when it actually applies changes. On an
    # idempotent re-run (changed=0) it returns immediately without waiting, so
    # the gateway pod may still be un-Ready (node rebooted / pods restarting).
    # Wait on the Deployment's availableReplicas directly: deterministic, self-
    # scaling to slow image pulls, and correct on re-runs. The HTTP probe that
    # follows is then only a thin guard for NodePort endpoint propagation.
    - name: "Ensure OpenFaaS gateway is reachable"
      block:
        - name: "Wait for OpenFaaS gateway Deployment to be Available"
          kubernetes.core.k8s_info:
            kind: Deployment
            name: gateway
            namespace: openfaas
            kubeconfig: "{{ k3s_config }}"
          register: gw_deploy
          until: >-
            (gw_deploy.resources | length > 0) and
            ((gw_deploy.resources[0].status.availableReplicas | default(0)) >= 1)
          retries: 60
          delay: 5

        - name: "Wait for OpenFaaS Gateway HTTP endpoint"
          ansible.builtin.uri:
            url: "{{ openfaas_url }}/system/functions"
            status_code: [200, 401]
          register: gateway_check
          until: gateway_check.status in [200, 401]
          retries: 30
          delay: 5
      rescue:
        - name: "Dump OpenFaaS pod state for diagnosis"
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: openfaas
            kubeconfig: "{{ k3s_config }}"
          register: openfaas_pods

        - name: "Show OpenFaaS pod names + phases"
          ansible.builtin.debug:
            msg: >-
              pods={{ openfaas_pods.resources | map(attribute='metadata.name') | list }}
              phases={{ openfaas_pods.resources | map(attribute='status.phase') | list }}

        - name: "Fail after dumping diagnostics"
          ansible.builtin.fail:
            msg: "OpenFaaS gateway did not become reachable on {{ inventory_hostname }} — see pod dump above"

    # list step intentionally shells out (faas_list RETURN only exposes the raw
    # CLI command, not a parsed name list); remove + deploy use modules.
    - name: "Get currently-deployed function names"
      ansible.builtin.command:
        cmd: "/usr/local/bin/faas-cli list --gateway={{ openfaas_url }} --quiet"
      register: deployed_functions_raw
      changed_when: false
      retries: 12
      delay: 10
      until: deployed_functions_raw.rc == 0

    - name: "Prune stale functions"
      mschuchard.general.faas_remove:
        name: "{{ item }}"
        gateway: "{{ openfaas_url }}"
      loop: "{{ deployed_functions_raw.stdout_lines | default([]) }}"
      when:
        - node_specific_functions is defined
        - item | length > 0
        - item not in (node_specific_functions | map(attribute='name') | list)

    - name: "Deploy / update functions from Environment spec"
      mschuchard.general.faas_deploy:
        image: "{{ item.image }}"
        name: "{{ item.name }}"
        gateway: "{{ openfaas_url }}"
        strategy: update
        env:
          exec_timeout: "{{ item.execTimeout }}s"
          max_inflight: "{{ item.maxInflight }}"
        label:
          dfaas.timeout_ms: "{{ item.timeoutMs }}"
          dfaas.maxrate: "{{ item.maxRate | default(100) }}"
      loop: "{{ node_specific_functions | default([]) }}"
      when: node_specific_functions is defined and (node_specific_functions | length) > 0

    - name: "Setup Kubeconfig for root"
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: "Link K3s config for root"
      ansible.builtin.file:
        src: "{{ k3s_config }}"
        dest: /root/.kube/config
        state: link
        force: true

    - name: "Install DFaaS Agent via Helm"
      kubernetes.core.helm:
        name: "dfaas-agent"
        chart_ref: "oci://ghcr.io/isired01/dfaas-agent-chart"
        chart_version: "0.1.3"
        release_namespace: "default"
        kubeconfig: "{{ k3s_config }}"
        wait: false
        values:
          image: "{{ dfaas_agent_image }}"
          imagePullPolicy: "{{ dfaas_agent_image_pull_policy }}"
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            {{ node_priv_key }}
            -----END PRIVATE KEY-----
          config:
            AGENT_DEBUG: "true"
            AGENT_BOOTSTRAP_NODES: "{{ 'true' if is_bootstrap | bool else 'false' }}"
            AGENT_BOOTSTRAP_NODES_LIST: "{{ bootstrap_address }}"
            AGENT_STRATEGY: "{{ balancing_strategy }}"
          forecaster:
            enabled: false
      register: agent_helm

    # The dfaas-agent chart feeds bootstrap config (AGENT_BOOTSTRAP_NODES_LIST)
    # via the pod's env; a helm upgrade that changes only that value does NOT
    # always roll the pod, so a re-provisioned Environment (new topology, or a
    # VM reused across environments) keeps a STALE bootstrap peer list and the
    # agent crash-loops (Exit 255) dialing dead peers. Force a rollout whenever
    # the release actually changed so the agent adopts the current config.
    - name: "Restart dfaas-agent to apply current bootstrap config"
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: dfaas-agent
        namespace: default
        kubeconfig: "{{ k3s_config }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ lookup('pipe', 'date -u +%FT%TZ') }}"
      when: agent_helm is changed

    - name: "Fix Prometheus host in Gateway"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_config }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: gateway
            namespace: openfaas
          spec:
            template:
              spec:
                containers:
                  - name: gateway
                    env:
                      - name: faas_prometheus_host
                        value: "prometheus.monitoring.svc.cluster.local"
                      - name: faas_prometheus_port
                        value: "9090"
