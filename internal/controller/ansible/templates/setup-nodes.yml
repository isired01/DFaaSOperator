---
- name: "Setup DFaaS Node"
  hosts: target_nodes
  become: true
  collections:
    - mschuchard.general
    - kubernetes.core
    - community.general
  vars:
    openfaas_url: "http://127.0.0.1:31112"
    k3s_config: "/etc/rancher/k3s/k3s.yaml"

    # --- Version pins (reproducibility) ---
    # Each defaults to empty = current behavior (install the latest available).
    # Set a value to pin that artifact so two provisioning runs build the
    # identical software stack — recommended for reproducible thesis experiments.
    # These are the single place to pin; edit the operator image / re-provision
    # (spec edit → generation drift) to apply changes.
    # ponytail: latest-by-default keeps existing behavior; pin per your validated versions.
    k3s_version: ""               # e.g. "v1.30.4+k3s1"; empty = latest stable channel
    helm_version: ""              # e.g. "v3.15.4"; empty = latest (get-helm-3)
    haproxy_chart_version: ""     # haproxytech/haproxy; empty = latest
    prometheus_chart_version: ""  # prometheus-community/prometheus; empty = latest
    openfaas_chart_version: ""    # openfaas/openfaas; empty = latest
    # dfaas-agent: the chart is pinned below (chart_version); the workload image
    # tag is the moving part. Pin it to a release tag or digest instead of the
    # mutable :dev for reproducible agent behavior.
    dfaas_agent_image: "ghcr.io/isired01/dfaas-agent:dev"
    dfaas_agent_image_pull_policy: "Always"

    # Role recorded on the node itself; see the repave block at the top of
    # tasks. Must match the NodeRole enum in api/v1/common_types.go.
    dfaas_role: dfaas-worker
    dfaas_role_marker: /etc/dfaas-role

  tasks:

    # --- Role-flip repave -------------------------------------------------
    # The node records its own role in {{ dfaas_role_marker }} as the last task
    # of a successful run. A mismatch means this machine was provisioned for the
    # other role, so its k3s -- installed with the other role's INSTALL_K3S_EXEC
    # flags -- and every workload on it must go before we layer this role on
    # top. k3s-uninstall.sh removes /var/lib/rancher/k3s (the embedded
    # datastore), so every Helm release, namespace and workload goes with it,
    # plus /etc/rancher/k3s and the uninstaller itself -- hence the stat guards.
    # The install tasks below are guarded on `stat /usr/local/bin/k3s`, so once
    # this block has run they reinstall k3s with THIS role's flags.
    #
    # ponytail: duplicated verbatim in the twin playbook. Factoring it into an
    # included tasks file needs Go plumbing, because EnsurePlaybookConfigMap
    # (ansible/config.go) ships only the one playbook for the role being run.
    - name: Check for a recorded role marker
      ansible.builtin.stat:
        path: "{{ dfaas_role_marker }}"
      register: dfaas_role_marker_stat

    # No failed_when: false here. Reading an existing marker as root must not
    # fail silently -- a swallowed read error would look like "fresh node" and
    # skip the wipe.
    - name: Read previously provisioned role
      ansible.builtin.slurp:
        src: "{{ dfaas_role_marker }}"
      register: dfaas_prev_role
      when: dfaas_role_marker_stat.stat.exists

    - name: Wipe k3s when the node held a different role
      when:
        - dfaas_role_marker_stat.stat.exists
        - (dfaas_prev_role.content | default('') | b64decode | trim) != dfaas_role
      block:
        - name: Check for the k3s uninstaller
          ansible.builtin.stat:
            path: /usr/local/bin/k3s-uninstall.sh
          register: k3s_uninstaller

        - name: Check whether k3s is still installed
          ansible.builtin.stat:
            path: /usr/local/bin/k3s
          register: k3s_present

        # Refuse to install this role on top of the other role's stack. A
        # missing uninstaller while k3s is still present means the node cannot
        # be cleaned, and continuing anyway is precisely the bug this block
        # exists to prevent. k3s already absent == nothing to wipe, so that
        # case falls through and provisioning proceeds normally.
        - name: Fail when the node holds a stale stack that cannot be removed
          ansible.builtin.fail:
            msg: >-
              node was provisioned as
              '{{ dfaas_prev_role.content | default('') | b64decode | trim }}' but
              /usr/local/bin/k3s-uninstall.sh is missing while
              /usr/local/bin/k3s is still present; refusing to layer
              '{{ dfaas_role }}' on top of the previous role's stack.
              Wipe the node manually and re-run.
          when:
            - k3s_present.stat.exists
            - not k3s_uninstaller.stat.exists

        - name: Run k3s-uninstall.sh
          ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
          when: k3s_uninstaller.stat.exists
          changed_when: true

        # Dropped straight after the wipe, not at the end of the play: if the
        # reinstall then fails mid-way, the next attempt sees no marker, resumes
        # the install on the already-clean node, and does not wipe a second time.
        - name: Drop the stale role marker
          ansible.builtin.file:
            path: "{{ dfaas_role_marker }}"
            state: absent
    # --- end role-flip repave --------------------------------------------
    - name: Disable APT automatic upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-disable-auto-upgrades
        content: |
          APT::Periodic::Enable "0";
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Configure sudo env_keep
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-preserve-env
        mode: "0440"
        content: |
          Defaults:%sudo env_keep += "KUBECONFIG"
          Defaults !always_set_home

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name: [buildah, curl, git, python3-pip, python3-kubernetes]
        state: present
        update_cache: true

    - name: Disable UFW firewall
      community.general.ufw:
        state: disabled

    - name: Ensure netfilter modules are loaded
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - nf_conntrack

    - name: Tune Kernel settings
      ansible.builtin.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/20-k3s-custom.conf
        state: present
        reload: true
        ignoreerrors: "{{ true if item.key == 'net.netfilter.nf_conntrack_max' else false }}"
      loop:
        - { key: "net.core.somaxconn", value: "8192" }
        - { key: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
        - { key: "net.ipv4.ip_local_port_range", value: "1024 65535" }
        - { key: "net.ipv4.tcp_tw_reuse", value: "1" }
        - { key: "net.netfilter.nf_conntrack_max", value: "262144" }

    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install K3S (only if missing)
      ansible.builtin.shell:
        cmd: >-
          curl -sfL https://get.k3s.io |
          {{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if k3s_version else '' }}
          INSTALL_K3S_EXEC="--disable traefik --disable servicelb" sh -
      when: not k3s_bin.stat.exists

    # The dfaas-agent publishes AGENT_NODE_IP to its peers as "forward requests
    # here", and the chart fills that from the kubelet's registered node IP. With
    # no --node-ip k3s picks the default-route address, which on a federation
    # spanning sites is the site-local one (e.g. a 192.168.252.x lab VM) and is
    # unroutable from the other sites — the mesh can form and offloading still
    # fails. {{ ansible_host }} is by definition the address the operator itself
    # reaches this node on, so it is the right thing to advertise.
    #
    # This block is the ONLY place node-ip is set. It used to be passed to
    # INSTALL_K3S_EXEC as well, on the theory that the flag covered fresh
    # installs and this block back-filled older ones. k3s does not let one win:
    # it MERGES the CLI flag with config.yaml and hands kubelet the pair, so a
    # fresh install died on
    #     failed to run Kubelet: bad --node-ip "10.0.0.1,10.0.0.1":
    #     must contain either a single IP or a dual-stack pair of IPs
    # and systemd restarted it forever. It stayed invisible while every node
    # already had k3s (the install task is skipped then, so ExecStart carried no
    # --node-ip); wiping the nodes made the fresh path the only path and the
    # crash-loop surfaced. Setting it here covers both cases: on a fresh install
    # the block is created, which triggers the restart below.
    - name: Ensure k3s registers the reachable address as its node IP (idempotent)
      ansible.builtin.blockinfile:
        path: /etc/rancher/k3s/config.yaml
        create: true
        mode: "0600"
        marker: "# {mark} DFAAS node-ip"
        block: |
          node-ip: "{{ ansible_host }}"
      register: dfaas_nodeip_cfg

    # Restarting k3s re-registers the Node object with the new address. Only on
    # change: an unconditional restart would bounce every workload on the node
    # on every reconcile.
    - name: Restart k3s to apply the node IP
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: dfaas_nodeip_cfg is changed

    - name: Ensure K3s service is started and enabled
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for K3s nodes to be ready
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: "{{ k3s_config }}"
      register: node_list
      # `is defined` first: when the API server is not up yet k8s_info FAILS
      # instead of returning an empty list, and the registered variable then has
      # no `resources` key at all. Referencing it bare makes Ansible abort the
      # task on a Jinja undefined-attribute error rather than consume a retry —
      # the 20 attempts below were never used once, and the failure surfaced to
      # the Environment Condition as "'dict object' has no attribute
      # 'resources'", which says nothing about the real problem.
      until: node_list.resources is defined and node_list.resources | length > 0
      retries: 20
      delay: 5

    - name: Check if Helm is installed
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_bin

    - name: Install Helm
      ansible.builtin.shell:
        cmd: >-
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 |
          {{ ('DESIRED_VERSION=' ~ helm_version) if helm_version else '' }} bash
      when: not helm_bin.stat.exists

    - name: Add Helm Repos
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
        # force_update makes this idempotent across re-provisioning. Without it the
        # module hard-fails with "Repository already have a repository named <x>"
        # whenever a repo of that name already exists with even a slightly different
        # URL (a trailing slash is enough). Since this playbook re-runs on every
        # spec edit — the documented update path — the second provisioning run of
        # any Environment died here, before any function change could be applied.
        force_update: true
      loop:
        - { name: "haproxytech", url: "https://haproxytech.github.io/helm-charts" }
        - { name: "prometheus-community", url: "https://prometheus-community.github.io/helm-charts" }
        - { name: "openfaas", url: "https://openfaas.github.io/faas-netes/" }

    - name: Create Namespaces for OpenFaaS
      kubernetes.core.k8s:
        name: "{{ item }}"
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ k3s_config }}"
      loop: [openfaas, openfaas-fn, monitoring, haproxy-controller]
      register: ns_create
      retries: 10
      delay: 6
      until: ns_create is succeeded

    - name: "Create local config directory on nodes"
      ansible.builtin.file:
        path: /opt/dfaas/helm-values
        state: directory
        mode: '0755'

    - name: "Copy Helm values"
      ansible.builtin.copy:
        src: "/opt/helm-values/{{ item }}.yaml"
        dest: "/opt/dfaas/helm-values/{{ item }}.yaml"
      loop: [haproxy, prometheus, openfaas]
      register: helm_values_copy

    - name: Install Helm Charts
      kubernetes.core.helm:
        name: "{{ item.name }}"
        chart_ref: "{{ item.chart }}"
        chart_version: "{{ item.version | default(omit, true) }}"
        release_namespace: "{{ item.ns }}"
        create_namespace: true
        wait: true
        kubeconfig: "{{ k3s_config }}"
        values_files:
          - "/opt/dfaas/helm-values/{{ item.name }}.yaml"
      loop:
        - { name: "haproxy", chart: "haproxytech/haproxy", ns: "haproxy-controller", version: "{{ haproxy_chart_version }}" }
        - { name: "prometheus", chart: "prometheus-community/prometheus", ns: "monitoring", version: "{{ prometheus_chart_version }}" }
        - { name: "openfaas", chart: "openfaas/openfaas", ns: "openfaas", version: "{{ openfaas_chart_version }}" }
      register: helm_install_result
      retries: 5
      delay: 15
      until: helm_install_result is succeeded

    - name: Check if faas-cli is installed
      ansible.builtin.stat:
        path: /usr/local/bin/faas-cli
      register: faas_cli_bin

    - name: Install faas-cli
      ansible.builtin.shell: curl -sSL https://cli.openfaas.com | sh
      when: not faas_cli_bin.stat.exists

    # Helm's `wait: true` only blocks when it actually applies changes. On an
    # idempotent re-run (changed=0) it returns immediately without waiting, so
    # the gateway pod may still be un-Ready (node rebooted / pods restarting).
    # Wait on the Deployment's availableReplicas directly: deterministic, self-
    # scaling to slow image pulls, and correct on re-runs. The HTTP probe that
    # follows is then only a thin guard for NodePort endpoint propagation.
    - name: "Ensure OpenFaaS gateway is reachable"
      block:
        - name: "Wait for OpenFaaS gateway Deployment to be Available"
          kubernetes.core.k8s_info:
            kind: Deployment
            name: gateway
            namespace: openfaas
            kubeconfig: "{{ k3s_config }}"
          register: gw_deploy
          until: >-
            (gw_deploy.resources | length > 0) and
            ((gw_deploy.resources[0].status.availableReplicas | default(0)) >= 1)
          retries: 60
          delay: 5

        - name: "Wait for OpenFaaS Gateway HTTP endpoint"
          ansible.builtin.uri:
            url: "{{ openfaas_url }}/system/functions"
            status_code: [200, 401]
          register: gateway_check
          until: gateway_check.status in [200, 401]
          retries: 30
          delay: 5
      rescue:
        - name: "Dump OpenFaaS pod state for diagnosis"
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: openfaas
            kubeconfig: "{{ k3s_config }}"
          register: openfaas_pods

        - name: "Show OpenFaaS pod names + phases"
          ansible.builtin.debug:
            msg: >-
              pods={{ openfaas_pods.resources | map(attribute='metadata.name') | list }}
              phases={{ openfaas_pods.resources | map(attribute='status.phase') | list }}

        - name: "Fail after dumping diagnostics"
          ansible.builtin.fail:
            msg: "OpenFaaS gateway did not become reachable on {{ inventory_hostname }} — see pod dump above"

    # list step intentionally shells out (faas_list RETURN only exposes the raw
    # CLI command, not a parsed name list); remove + deploy use modules.
    - name: "Get currently-deployed function names"
      ansible.builtin.command:
        cmd: "/usr/local/bin/faas-cli list --gateway={{ openfaas_url }} --quiet"
      register: deployed_functions_raw
      changed_when: false
      retries: 12
      delay: 10
      until: deployed_functions_raw.rc == 0

    - name: "Prune stale functions"
      mschuchard.general.faas_remove:
        name: "{{ item }}"
        gateway: "{{ openfaas_url }}"
      loop: "{{ deployed_functions_raw.stdout_lines | default([]) }}"
      when:
        - node_specific_functions is defined
        - item | length > 0
        - item not in (node_specific_functions | map(attribute='name') | list)

    - name: "Deploy / update functions from Environment spec"
      mschuchard.general.faas_deploy:
        image: "{{ item.image }}"
        name: "{{ item.name }}"
        gateway: "{{ openfaas_url }}"
        strategy: update
        env:
          exec_timeout: "{{ item.execTimeout }}s"
          max_inflight: "{{ item.maxInflight }}"
        label:
          dfaas.timeout_ms: "{{ item.timeoutMs }}"
          dfaas.maxrate: "{{ item.maxRate | default(100) }}"
      loop: "{{ node_specific_functions | default([]) }}"
      when: node_specific_functions is defined and (node_specific_functions | length) > 0

    - name: "Setup Kubeconfig for root"
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: "Link K3s config for root"
      ansible.builtin.file:
        src: "{{ k3s_config }}"
        dest: /root/.kube/config
        state: link
        force: true

    - name: "Install DFaaS Agent via Helm"
      kubernetes.core.helm:
        name: "dfaas-agent"
        chart_ref: "oci://ghcr.io/isired01/dfaas-agent-chart"
        chart_version: "0.1.3"
        release_namespace: "default"
        kubeconfig: "{{ k3s_config }}"
        wait: false
        values:
          image: "{{ dfaas_agent_image }}"
          imagePullPolicy: "{{ dfaas_agent_image_pull_policy }}"
          privateKey: |
            -----BEGIN PRIVATE KEY-----
            {{ node_priv_key }}
            -----END PRIVATE KEY-----
          config:
            AGENT_DEBUG: "true"
            AGENT_BOOTSTRAP_NODES: "{{ 'true' if is_bootstrap | bool else 'false' }}"
            AGENT_BOOTSTRAP_NODES_LIST: "{{ bootstrap_address }}"
            # Retry the bootstrap dial every 5s until the listed peers answer.
            # Workers are provisioned in PARALLEL, so a non-seed agent routinely
            # starts before its predecessors' agents exist; with FORCE=false the
            # agent's retry loop has no delay at all (kademlia.go: it logs the
            # error and immediately re-dials), so a peer that is not up yet
            # means a hot spin logging one failure per iteration, and no peer
            # ever appears because Kademlia discovery is dead in this build (the
            # agent registers no /ipfs/kad/1.0.0 handler, so every routing table
            # stays empty). Trade-off: if a listed peer is permanently down the
            # pod stays in init rather than running solo, which is the honest
            # state for a node that cannot federate.
            AGENT_BOOTSTRAP_FORCE: "{{ 'true' if is_bootstrap | bool else 'false' }}"
            AGENT_STRATEGY: "{{ balancing_strategy }}"
            # The newer agent dropped its hardwired addresses and wants them
            # from configuration. Use the node's own NodePorts instead of the
            # Service DNS, which only resolves inside the cluster and under a
            # namespace the agent does not know (haproxy lives in
            # haproxy-controller, not in default).
            AGENT_RUNTIMEAPI_HOST: "{{ ansible_host }}"
            AGENT_RUNTIMEAPI_PORT: "30666"
            AGENT_DATAPLANEAPI_HOST: "{{ ansible_host }}"
            AGENT_DATAPLANEAPI_PORT: "30555"
            # Port a node uses to reach a NEIGHBOUR's HAProxy. The default 80
            # is the cluster-internal port: from outside the NodePort is
            # required. randomstrategy.go carries a FIXME on exactly this.
            AGENT_HAPROXY_PORT: "30080"
            # The random template always emits "server rejector": if the host
            # does not resolve, HAProxy refuses to load the configuration. With
            # REJECT=false it stays at weight 0 and receives nothing, so a
            # valid address is enough.
            AGENT_REJECTOR_HOST: "{{ ansible_host }}"
            AGENT_REJECTOR_PORT: "30080"
            AGENT_RANDOM_REJECT: "false"
            # -1 = seed from the clock. Do not leave it implicit: Viper applies
            # no default, and an unset variable reads as 0, i.e. a fixed seed.
            AGENT_RANDOM_SEED: "-1"
          forecaster:
            enabled: false
      register: agent_helm

    # The dfaas-agent chart feeds bootstrap config (AGENT_BOOTSTRAP_NODES_LIST)
    # via the pod's env; a helm upgrade that changes only that value does NOT
    # always roll the pod, so a re-provisioned Environment (new topology, or a
    # VM reused across environments) keeps a STALE bootstrap peer list and the
    # agent crash-loops (Exit 255) dialing dead peers. Force a rollout whenever
    # the release actually changed so the agent adopts the current config.
    - name: "Restart dfaas-agent to apply current bootstrap config"
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: dfaas-agent
        namespace: default
        kubeconfig: "{{ k3s_config }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ lookup('pipe', 'date -u +%FT%TZ') }}"
      when: agent_helm is changed

    - name: "Fix Prometheus host in Gateway"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_config }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: gateway
            namespace: openfaas
          spec:
            template:
              spec:
                containers:
                  - name: gateway
                    env:
                      - name: faas_prometheus_host
                        value: "prometheus.monitoring.svc.cluster.local"
                      - name: faas_prometheus_port
                        value: "9090"

    # Recorded LAST. A play that dies mid-way therefore leaves either the
    # previous role on disk or no marker at all (if the wipe already ran), so
    # the next attempt re-evaluates instead of trusting a half-done install.
    - name: Record the provisioned role on the node
      ansible.builtin.copy:
        dest: "{{ dfaas_role_marker }}"
        content: "{{ dfaas_role }}\n"
        mode: '0644'
