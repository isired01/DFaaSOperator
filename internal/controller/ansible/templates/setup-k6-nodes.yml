---
- name: "Provision k6 load-generator (k3s + k6-operator) and push kubeconfig"
  hosts: k6_nodes
  become: true
  gather_facts: true
  collections:
    - kubernetes.core
    - community.general
  vars:
    k3s_config_remote: /etc/rancher/k3s/k3s.yaml
    k6_namespace: k6-operator-system
    k6_chart_version: "3.7.0"
    mgmt_secret_name: "{{ env_name }}-{{ node_id }}-kubeconfig"

    # Role recorded on the node itself; see the repave block at the top of
    # tasks. Must match the NodeRole enum in api/v1/common_types.go.
    dfaas_role: k6-load-generator
    dfaas_role_marker: /etc/dfaas-role

  tasks:

    # --- Role-flip repave -------------------------------------------------
    # The node records its own role in {{ dfaas_role_marker }} as the last task
    # of a successful run. A mismatch means this machine was provisioned for the
    # other role, so its k3s -- installed with the other role's INSTALL_K3S_EXEC
    # flags -- and every workload on it must go before we layer this role on
    # top. k3s-uninstall.sh removes /var/lib/rancher/k3s (the embedded
    # datastore), so every Helm release, namespace and workload goes with it,
    # plus /etc/rancher/k3s and the uninstaller itself -- hence the stat guards.
    # The install tasks below are guarded on `stat /usr/local/bin/k3s`, so once
    # this block has run they reinstall k3s with THIS role's flags.
    #
    # ponytail: duplicated verbatim in the twin playbook. Factoring it into an
    # included tasks file needs Go plumbing, because EnsurePlaybookConfigMap
    # (ansible/config.go) ships only the one playbook for the role being run.
    - name: Check for a recorded role marker
      ansible.builtin.stat:
        path: "{{ dfaas_role_marker }}"
      register: dfaas_role_marker_stat

    # No failed_when: false here. Reading an existing marker as root must not
    # fail silently -- a swallowed read error would look like "fresh node" and
    # skip the wipe.
    - name: Read previously provisioned role
      ansible.builtin.slurp:
        src: "{{ dfaas_role_marker }}"
      register: dfaas_prev_role
      when: dfaas_role_marker_stat.stat.exists

    - name: Wipe k3s when the node held a different role
      when:
        - dfaas_role_marker_stat.stat.exists
        - (dfaas_prev_role.content | default('') | b64decode | trim) != dfaas_role
      block:
        - name: Check for the k3s uninstaller
          ansible.builtin.stat:
            path: /usr/local/bin/k3s-uninstall.sh
          register: k3s_uninstaller

        - name: Check whether k3s is still installed
          ansible.builtin.stat:
            path: /usr/local/bin/k3s
          register: k3s_present

        # Refuse to install this role on top of the other role's stack. A
        # missing uninstaller while k3s is still present means the node cannot
        # be cleaned, and continuing anyway is precisely the bug this block
        # exists to prevent. k3s already absent == nothing to wipe, so that
        # case falls through and provisioning proceeds normally.
        - name: Fail when the node holds a stale stack that cannot be removed
          ansible.builtin.fail:
            msg: >-
              node was provisioned as
              '{{ dfaas_prev_role.content | default('') | b64decode | trim }}' but
              /usr/local/bin/k3s-uninstall.sh is missing while
              /usr/local/bin/k3s is still present; refusing to layer
              '{{ dfaas_role }}' on top of the previous role's stack.
              Wipe the node manually and re-run.
          when:
            - k3s_present.stat.exists
            - not k3s_uninstaller.stat.exists

        - name: Run k3s-uninstall.sh
          ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
          when: k3s_uninstaller.stat.exists
          changed_when: true

        # Dropped straight after the wipe, not at the end of the play: if the
        # reinstall then fails mid-way, the next attempt sees no marker, resumes
        # the install on the already-clean node, and does not wipe a second time.
        - name: Drop the stale role marker
          ansible.builtin.file:
            path: "{{ dfaas_role_marker }}"
            state: absent
    # --- end role-flip repave --------------------------------------------
    - name: Disable APT automatic upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-disable-auto-upgrades
        content: |
          APT::Periodic::Enable "0";
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name: [curl, python3-pip, python3-kubernetes, ca-certificates]
        state: present
        update_cache: true

    - name: Disable UFW firewall
      community.general.ufw:
        state: disabled

    - name: Ensure netfilter modules are loaded
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [br_netfilter, nf_conntrack]

    - name: Check if k3s binary is present
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install k3s (single-node, no Traefik, no ServiceLB)
      ansible.builtin.shell:
        cmd: |
          curl -sfL https://get.k3s.io | \
            INSTALL_K3S_EXEC="--disable traefik --disable servicelb --write-kubeconfig-mode=644 --tls-san {{ ansible_host }}" sh -
      when: not k3s_bin.stat.exists

    # The kubeconfig server URL is rewritten to {{ ansible_host }} below, so the
    # kube-apiserver serving cert MUST carry that address as a SAN or the
    # management operator's TLS client rejects it ("x509: certificate is valid
    # for ..., not <ansible_host>"). --tls-san above covers fresh installs;
    # this block self-heals nodes provisioned before the SAN was added — k3s
    # rebuilds the serving cert (additive to its default 127.0.0.1 / node-IP /
    # cluster SANs) on next start when the dynamic cert files are removed. The
    # cluster CA is untouched, so any kubeconfig already pushed stays valid.
    - name: Ensure k3s TLS SAN includes the reachable address (idempotent)
      ansible.builtin.blockinfile:
        path: /etc/rancher/k3s/config.yaml
        create: true
        mode: "0600"
        marker: "# {mark} DFAAS tls-san"
        block: |
          tls-san:
            - "{{ ansible_host }}"
      notify: Rotate k3s serving certificate

    - name: Apply any pending serving-cert rotation before using the API
      ansible.builtin.meta: flush_handlers

    - name: Ensure k3s service is started + enabled
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for k3s Node to be Ready
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: "{{ k3s_config_remote }}"
      register: k3s_nodes
      until: k3s_nodes.resources | length > 0
      retries: 30
      delay: 5

    - name: Check if Helm is installed
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_bin

    - name: Install Helm
      ansible.builtin.shell:
        cmd: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: not helm_bin.stat.exists

    - name: Add grafana Helm repo
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: https://grafana.github.io/helm-charts

    - name: Ensure k6-operator namespace adopted by Helm
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_config_remote }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k6_namespace }}"
            labels:
              app.kubernetes.io/managed-by: Helm
            annotations:
              meta.helm.sh/release-name: k6-operator
              meta.helm.sh/release-namespace: "{{ k6_namespace }}"

    - name: Install k6-operator chart
      kubernetes.core.helm:
        name: k6-operator
        chart_ref: grafana/k6-operator
        chart_version: "{{ k6_chart_version }}"
        release_namespace: "{{ k6_namespace }}"
        wait: true
        kubeconfig: "{{ k3s_config_remote }}"
        values:
          # Disable kube-rbac-proxy sidecar: upstream chart pins
          # gcr.io/kubebuilder/kube-rbac-proxy:v0.15.0 which no longer
          # exists (kubebuilder retired that registry path). Nothing on
          # the remote k3s scrapes the operator's /metrics endpoint, so
          # the sidecar is dead weight and locks the pod at 1/2 Ready.
          authProxy:
            enabled: false

    - name: Read the k3s kubeconfig
      ansible.builtin.slurp:
        src: "{{ k3s_config_remote }}"
      register: kubeconfig_b64

    - name: Rewrite server URL to public IP
      ansible.builtin.set_fact:
        kubeconfig_rendered: >-
          {{
            (kubeconfig_b64.content | b64decode)
            | replace('https://127.0.0.1:6443', 'https://' + ansible_host + ':6443')
          }}

    - name: "Validate rendered kubeconfig is non-empty and shaped like a kubeconfig"
      ansible.builtin.assert:
        that:
          - kubeconfig_rendered | length > 0
          - "'apiVersion:' in kubeconfig_rendered"
          - "'clusters:' in kubeconfig_rendered"
          - "'users:' in kubeconfig_rendered"
          - env_uid is defined
          - env_uid | length > 0
        fail_msg: >-
          kubeconfig_rendered is empty or malformed, or env_uid is missing from
          the inventory (buildInventory in internal/controller/ansible/job.go
          must emit env_uid for the ownerReference below); refusing to push a
          broken Secret

    # Bypass kubernetes.core.k8s: under alpine ansible 2.18.6 the python
    # kubernetes client (v36.0.0) has a bug where Configuration.auth_settings()
    # checks for 'BearerToken' in api_key but load_kube_config writes the
    # token under api_key['authorization'] — keys don't match, no
    # Authorization header is attached, the API server returns 401 on
    # GET /version. Both `host`+`api_key` and `kubeconfig:` parameters hit
    # the same broken loader. Talking to the management API directly with
    # uri: bypasses the python lib entirely. Server-side apply against the
    # named resource URL is create-or-update idempotent in a single PATCH.
    # Body uses data.kubeconfig with b64encode to avoid YAML-in-YAML indentation pitfalls; clientcmd.Load on the operator side reads Secret.Data["kubeconfig"] as []byte (client-go auto-decodes base64).
    - name: "Read in-pod SA token (trim trailing newline)"
      delegate_to: localhost
      become: false
      ansible.builtin.set_fact:
        sa_token: "{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token') | trim }}"
      no_log: true

    - name: "Push kubeconfig Secret to management cluster (server-side apply)"
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "https://kubernetes.default.svc.cluster.local/api/v1/namespaces/{{ env_namespace }}/secrets/{{ mgmt_secret_name }}?fieldManager=dfaas-ansible&force=true"
        method: PATCH
        ca_path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        headers:
          Authorization: "Bearer {{ sa_token }}"
          Content-Type: "application/apply-patch+yaml"
          Accept: "application/json"
        body_format: raw
        body: |
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: {{ mgmt_secret_name }}
            namespace: {{ env_namespace }}
            ownerReferences:
              - apiVersion: dfaas.dfaas.io/v1
                kind: Environment
                name: {{ env_name }}
                uid: {{ env_uid }}
            labels:
              dfaas.io/env: {{ env_name }}
              dfaas.io/node-id: "{{ node_id }}"
          data:
            kubeconfig: {{ kubeconfig_rendered | b64encode }}
        status_code: [200, 201]
        return_content: false
        timeout: 30
      register: push_secret
      retries: 3
      delay: 5
      until: push_secret.status in [200, 201]
      no_log: true

    # Recorded LAST. A play that dies mid-way therefore leaves either the
    # previous role on disk or no marker at all (if the wipe already ran), so
    # the next attempt re-evaluates instead of trusting a half-done install.
    - name: Record the provisioned role on the node
      ansible.builtin.copy:
        dest: "{{ dfaas_role_marker }}"
        content: "{{ dfaas_role }}\n"
        mode: '0644'

  handlers:
    # Force k3s to regenerate the kube-apiserver serving cert with the SAN list
    # from /etc/rancher/k3s/config.yaml. Deleting only the serving cert pair is
    # safe: k3s recreates it from the existing cluster CA on the next start, so
    # the CA fingerprint embedded in pushed kubeconfigs does not change.
    - name: Rotate k3s serving certificate
      ansible.builtin.shell:
        cmd: |
          systemctl stop k3s
          rm -f /var/lib/rancher/k3s/server/tls/serving-kube-apiserver.crt \
                /var/lib/rancher/k3s/server/tls/serving-kube-apiserver.key
          systemctl start k3s
