apiVersion: dfaas.dfaas.io/v1
kind: Environment
metadata:
  name: env-sample
  namespace: default
spec:
  # s3ConfigRef is optional. When set, every LoadTest targeting this
  # Environment uploads its metrics CSV to the S3 endpoint registered as
  # Secret "dfaas-s3/<name>" (label dfaas.io/s3-config=true). When unset,
  # the exporter uses the built-in in-cluster SeaweedFS sink
  # ("seaweedfs-default") — no S3 setup required.
  # s3ConfigRef:
  #   name: example-s3
  nodes:
    - nodeID: dfaas-worker-1
      ipAddress: 10.0.0.5   # replace with the DFaaS node VM's address
      role: dfaas-worker
      capacity: MEDIUM
      username: ubuntu
      password: CHANGE_ME
      balancingStrategy: alllocalstrategy
      functions:
        - name: figlet
          image: ghcr.io/openfaas/figlet:latest
          execTimeout: 5
          maxInflight: 400
          timeoutMs: 6000
    - nodeID: k6-gen-1
      ipAddress: 10.0.0.6   # replace with the generator VM's address
      role: k6-load-generator
      capacity: HIGH
      username: ubuntu
      password: CHANGE_ME
