apiVersion: dfaas.dfaas.io/v1
kind: LoadTest
metadata:
  name: loadtest-sample
  namespace: default
spec:
  targetEnvironment: env-sample
  # suspended: true   # Save-as-Draft: holds phase=Pending (read the draft
  # state from spec.suspended — there is no Suspended
  # condition), no k6 dispatch. PATCH to false to
  # activate. The UI sets it for drafts and scheduled tests; default false.
  # Required if you set startAt.
  # stop: true        # Abort: PATCH spec.stop=true to delete every remote
  # TestRun across k6 nodes and transition the CR to
  # the terminal "Aborted" phase (CR persists as
  # historical record). Honoured while phase is "", Pending or Running.
  # Stamps Conditions[Ready]=False
  # reason=UserAborted on completion.
  perNodeLoad:
    - nodeID: k6-gen-1
      # vus and duration are recorded for the UI only: the script's options
      # decide the load and the run length.
      vus: 50
      duration: 30s
      scriptConfigMap:
        name: loadtest-sample-script
  metricsExport:
    step: 15s
    metrics:
      - type: raw
        metricName: mem_available
        query: node_memory_MemAvailable_bytes
        comment: "Free memory per node (bare metric)"
      # Rate windows must be >= 4x the federation interval (the management
      # Prometheus's server.global.scrape_interval, in the operator's embedded
      # prometheus-values.yaml): rate() needs two samples inside its window
      # and returns nothing whenever one is late. [5m] reliably yields data.
      - type: custom-promql
        metricName: cpu_rate
        query: rate(node_cpu_seconds_total[5m])
        comment: "CPU usage rate per node (PromQL expression)"
    # CSV destination is decided on the Environment (spec.s3ConfigRef).
    # When the Environment has no s3ConfigRef, the exporter writes to the
    # built-in in-cluster SeaweedFS sink ("seaweedfs-default"); it only
    # falls back to a stdout dump if that default Secret has been deleted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadtest-sample-script
  namespace: default
data:
  script.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      vus: 50,
      duration: '30s',
    };

    export default function () {
      http.post('http://10.0.0.5:30080/function/figlet', 'dfaas');
      sleep(1);
    }

    export function handleSummary(data) {
      if (__ENV.DFAAS_SUMMARY_URL) {
        http.put(__ENV.DFAAS_SUMMARY_URL, JSON.stringify(data), {
          headers: { 'Content-Type': 'application/json' },
        });
      }
      return { stdout: JSON.stringify(data) };
    }
