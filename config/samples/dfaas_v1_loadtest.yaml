apiVersion: dfaas.dfaas.io/v1
kind: LoadTest
metadata:
  name: loadtest-sample
  namespace: default
spec:
  targetEnvironment: env-sample
  # suspended: true   # Save-as-Draft: holds phase=Pending + stamps
                      # Conditions[Suspended]=True, no k6 dispatch.
                      # PATCH to false to activate. UI sets this on
                      # create; default false for plain `kubectl apply`.
  # stop: true        # Abort: PATCH spec.stop=true to delete every remote
                      # TestRun across k6 nodes and transition the CR to
                      # the terminal "Aborted" phase (CR persists as
                      # historical record). Only honored from Pending or
                      # Running. Stamps Conditions[Ready]=False
                      # reason=UserAborted on completion.
  perNodeLoad:
    - nodeID: k6-gen-1
      vus: 50
      duration: 30s
      scriptConfigMap:
        name: loadtest-sample-script
  metricsExport:
    step: 15s
    metrics:
      - type: raw
        metricName: mem_available
        query: node_memory_MemAvailable_bytes
        comment: "Free memory per node (bare metric)"
      - type: custom-promql
        metricName: cpu_rate
        query: rate(node_cpu_seconds_total[1m])
        comment: "CPU usage rate per node (PromQL expression)"
    # CSV destination is decided on the Environment (spec.s3ConfigRef).
    # When the Environment has no s3ConfigRef, the exporter dumps the CSV
    # to stdout between markers "----- BEGIN CSV -----" / "----- END CSV -----"
    # (retrievable via `kubectl logs job/<loadtest>-exporter-job`).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadtest-sample-script
  namespace: default
data:
  script.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      vus: 50,
      duration: '30s',
    };

    export default function () {
      http.get('http://192.168.252.60:31112/function/figlet');
      sleep(1);
    }
