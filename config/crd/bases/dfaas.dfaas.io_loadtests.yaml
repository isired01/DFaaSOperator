---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: loadtests.dfaas.dfaas.io
spec:
  group: dfaas.dfaas.io
  names:
    kind: LoadTest
    listKind: LoadTestList
    plural: loadtests
    singular: loadtest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetEnvironment
      name: Environment
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: LoadTest is the schema for a single load-test run against an
          Environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LoadTestSpec is the desired state of one load test against
              an Environment.
            properties:
              metricsExport:
                description: MetricsExportSpec drives the exporter Job that runs after
                  k6 finishes.
                properties:
                  googleDrive:
                    description: GoogleDrive is the optional CSV destination. nil
                      → stdout.
                    properties:
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef references a Secret in the resource's namespace
                          holding key "credentials.json" with the Google service-account JSON.
                        type: string
                      folderId:
                        type: string
                    required:
                    - credentialsSecretRef
                    - folderId
                    type: object
                  queries:
                    description: PromQL queries pipe-joined and passed to the exporter
                      as $QUERIES.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  step:
                    default: 15s
                    description: Step for QueryRange (Go duration string).
                    type: string
                required:
                - queries
                type: object
              perNodeLoad:
                description: One entry per k6-load-generator node the test should
                  hit.
                items:
                  description: |-
                    PerNodeLoad is the FE-supplied per-k6-machine load. The reconciler creates
                    one remote TestRun per entry against the matching k6-load-generator node's
                    k3s cluster.
                  properties:
                    duration:
                      description: k6 test duration (Go duration string, e.g. "30s",
                        "5m").
                      type: string
                    nodeID:
                      description: NodeID must match a k6-load-generator node in the
                        target Environment.
                      type: string
                    scriptConfigMap:
                      description: |-
                        ScriptConfigMap references a ConfigMap in the same namespace exposing
                        key "script.js" with the k6 script for this machine. The FE writes one
                        ConfigMap per LoadTest.
                      properties:
                        name:
                          description: |-
                            Name of the referent.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    vus:
                      description: k6 virtual-users for this machine.
                      minimum: 1
                      type: integer
                  required:
                  - duration
                  - nodeID
                  - scriptConfigMap
                  - vus
                  type: object
                minItems: 1
                type: array
              targetEnvironment:
                description: Name of an Environment in the same namespace.
                type: string
            required:
            - metricsExport
            - perNodeLoad
            - targetEnvironment
            type: object
          status:
            description: LoadTestStatus is the observed state of a LoadTest.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endTime:
                format: date-time
                type: string
              exporterJob:
                description: |-
                  ExporterJob is the in-cluster Job name created during the Exporting
                  phase.
                type: string
              message:
                type: string
              phase:
                description: LoadTestPhase tracks the lifecycle of a single load test.
                enum:
                - Pending
                - Running
                - Exporting
                - Completed
                - Failed
                type: string
              startTime:
                format: date-time
                type: string
              testRuns:
                items:
                  description: TestRunRef records one remote TestRun dispatched on
                    a k6 machine's k3s.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    nodeID:
                      type: string
                    phase:
                      type: string
                  required:
                  - name
                  - namespace
                  - nodeID
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
