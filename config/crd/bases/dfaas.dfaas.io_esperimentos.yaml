---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: esperimentos.dfaas.dfaas.io
spec:
  group: dfaas.dfaas.io
  names:
    kind: Esperimento
    listKind: EsperimentoList
    plural: esperimentos
    singular: esperimento
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.fase
      name: Phase
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: Esperimento è lo schema per la risorsa singola
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EsperimentoSpec definisce i parametri di configurazione del
              SINGOLO esperimento
            properties:
              federazione:
                description: Configurazione della federazione dedicata
                properties:
                  nodi:
                    description: Lista dei nodi della federazione per questo specifico
                      esperimento
                    items:
                      properties:
                        capacita:
                          type: string
                        chiavePrivata:
                          type: string
                        funzioni:
                          description: Lista di configurazioni per le funzioni da
                            deployare su questo nodo
                          items:
                            properties:
                              execTimeout:
                                default: 5
                                description: Tempo massimo di esecuzione (corrisponde
                                  a exec_timeout)
                                type: integer
                              immagine:
                                description: |-
                                  Immagine completa (es: "functions/figlet:latest")
                                  Necessaria per evitare errore 400 su OpenFaaS CE
                                type: string
                              maxInflight:
                                default: 400
                                description: Massimo numero di richieste parallele
                                  (corrisponde a max_inflight)
                                type: integer
                              nome:
                                description: 'Nome della funzione (es: "figlet")'
                                type: string
                              timeoutMs:
                                default: 6000
                                description: Timeout logico per l'operatore dFaaS
                                  in millisecondi
                                type: integer
                            required:
                            - execTimeout
                            - immagine
                            - maxInflight
                            - nome
                            - timeoutMs
                            type: object
                          type: array
                        idNodo:
                          type: string
                        indirizzoIP:
                          type: string
                        password:
                          type: string
                        userName:
                          type: string
                      required:
                      - capacita
                      - chiavePrivata
                      - idNodo
                      - indirizzoIP
                      - password
                      - userName
                      type: object
                    minItems: 1
                    type: array
                  strategia:
                    description: 'Strategia di load balancing (es: "ROUND_ROBIN")'
                    type: string
                required:
                - nodi
                - strategia
                type: object
              isCleanupRequested:
                default: false
                description: Flag per richiedere la pulizia delle risorse a fine test
                type: boolean
              topologia:
                description: Topologia di rete dell'esperimento
                properties:
                  links:
                    description: Definizione dei link di rete tra i nodi dell'esperimento
                    items:
                      properties:
                        latenzaMs:
                          type: integer
                        nodoA:
                          type: string
                        nodoB:
                          type: string
                      required:
                      - latenzaMs
                      - nodoA
                      - nodoB
                      type: object
                    type: array
                required:
                - links
                type: object
            required:
            - federazione
            - isCleanupRequested
            - topologia
            type: object
          status:
            description: EsperimentoStatus definisce lo stato osservato dell'istanza
              (gestito dal Controller)
            properties:
              conditions:
                description: Conditions rappresenta l'osservazione dello stato attuale
                  dell'esperimento
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              fase:
                default: IDLE
                description: Stato attuale dell'esecuzione
                type: string
              message:
                description: Messaggio di dettaglio (es. motivo di un FAILED)
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
