# permissions for end users to view esperimentos.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dfaas-operator
    app.kubernetes.io/managed-by: kustomize
  name: esperimento-viewer-role
rules:
- apiGroups:
  - dfaas.dfaas.io
  resources:
  - esperimentos
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dfaas.dfaas.io
  resources:
  - esperimentos/status
  verbs:
  - get
