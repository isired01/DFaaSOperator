---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - dfaas.dfaas.io
  resources:
  - configmaps
  - esperimentos
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dfaas.dfaas.io
  resources:
  - esperimentos/finalizers
  verbs:
  - update
- apiGroups:
  - dfaas.dfaas.io
  resources:
  - esperimentos/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - dfaas.dfaas.io
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - k6.io
  resources:
  - testruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - k6.io
  resources:
  - testruns/status
  verbs:
  - get
