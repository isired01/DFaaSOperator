name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Images are published under both v0.2.0 and 0.2.0: the chart defaults
      # every image tag to .Chart.AppVersion, which is packaged without the v.
      - name: Compute version (strip leading v)
        run: echo "VERSION_NO_V=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/isired01/dfaas-operator:${{ env.VERSION }}
            ghcr.io/isired01/dfaas-operator:${{ env.VERSION_NO_V }}
            ghcr.io/isired01/dfaas-operator:latest

      - name: Build & push exporter image
        uses: docker/build-push-action@v6
        with:
          context: dataExporter
          file: dataExporter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/isired01/dfaas-exporter:${{ env.VERSION }}
            ghcr.io/isired01/dfaas-exporter:${{ env.VERSION_NO_V }}
            ghcr.io/isired01/dfaas-exporter:latest

      # The UI repo builds on its own tag push, in parallel with this job. Its
      # multi-arch build is the slow one, so give it a real window rather than
      # the minute it used to get.
      - name: Wait for UI image to be published
        run: |
          for i in $(seq 1 60); do
            if docker manifest inspect "ghcr.io/isired01/dfaas-control-plane:${VERSION}" >/dev/null 2>&1; then
              echo "UI image ready"
              exit 0
            fi
            echo "UI image not ready yet (attempt $i/60), sleeping 15s"
            sleep 15
          done
          echo "UI image never appeared after 15 min; failing release."
          echo "Did you push the tag ${VERSION} to the UI repo too?"
          exit 1

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm lint
        run: helm lint charts/dfaas

      - name: Attach CRDs to release (downloaded manually pre-install)
        run: |
          mkdir -p dist
          cp config/crd/bases/dfaas.dfaas.io_environments.yaml dist/
          cp config/crd/bases/dfaas.dfaas.io_loadtests.yaml    dist/

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/dfaas \
            --version "${VERSION_NO_V}" \
            --app-version "${VERSION_NO_V}" \
            --destination dist/

      - name: Push chart to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm push "dist/dfaas-${VERSION_NO_V}.tgz" oci://ghcr.io/isired01/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dfaas-${{ env.VERSION_NO_V }}.tgz
            dist/dfaas.dfaas.io_environments.yaml
            dist/dfaas.dfaas.io_loadtests.yaml
          generate_release_notes: true
