name: dev image

# Publishes ghcr.io/isired01/dfaas-operator:dev from any branch that is not
# main. Deliberately NOT release.yml: that one is tag-driven and, besides the
# operator, moves :latest, cuts a GitHub Release, pushes the Helm chart and
# blocks for 15 minutes on a matching dfaas-control-plane tag from the UI repo.
# None of that belongs to a throwaway build of one image.
on:
  push:
    # Every branch, main included: this project commits straight to main, so
    # excluding it would leave :dev frozen at whatever branch last touched it.
    # Branches only, never tags — a v* tag is release.yml's job, and letting it
    # run here too would overwrite :dev with a release build.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  operator-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same platforms as the release build: the management cluster is amd64,
      # the laptop node is arm64.
      - name: Build & push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/isired01/dfaas-operator:dev
