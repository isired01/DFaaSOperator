name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A CRD field that exists only in Go compiles, passes every unit test,
      # and is then pruned by the API server at runtime. Nothing downstream can
      # catch that, so catch it here.
      - name: Generated artifacts are committed
        run: |
          make manifests generate fmt
          git diff --exit-code

      # The chart ships its own copy of the CRDs; they are what a real install
      # applies. A stale copy prunes the field just as silently.
      - name: Chart CRDs match config/crd/bases
        run: |
          for f in dfaas.dfaas.io_environments.yaml dfaas.dfaas.io_loadtests.yaml; do
            diff -u "config/crd/bases/$f" "charts/dfaas/crds/$f"
          done

      # make test = manifests + generate + fmt + vet + envtest assets + go test
      # over `go list ./... | grep -v /e2e`. Never run ./test/e2e here: it
      # applies cert-manager and the prometheus-operator bundle to whatever
      # kubeconfig context is active, with no guard.
      - run: make test

      # A Dockerfile is source no Go check reads. Two real breakages got past
      # everything above: the operator image omitted internal/reach and
      # internal/syncchannel from its COPY list, and the exporter compiled
      # `go build main.go` after main.go was split into three files. Both built
      # a green branch that shipped nothing. Native arch only, no push -- this
      # gate is about whether the build succeeds, not about the artifact.
      - name: Images build
        run: |
          docker build -t dfaas-operator:ci .
          docker build -t dfaas-exporter:ci dataExporter
          docker build -t dfaas-imgproc:ci imageFunction
