name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A CRD field that exists only in Go compiles, passes every unit test,
      # and is then pruned by the API server at runtime. Nothing downstream can
      # catch that, so catch it here.
      - name: Generated artifacts are committed
        run: |
          make manifests generate fmt
          git diff --exit-code

      # An untidy go.mod builds and tests fine, so nothing else here notices:
      # google.golang.org/api sat in it as a direct requirement nothing
      # imported, and gopls marked the file red for the modules tidy would
      # add. `tidy -diff` fails without rewriting; `verify` checks the module
      # cache against go.sum. Three modules live in this repo.
      - name: go.mod is tidy and verified
        run: |
          for m in . dataExporter imageFunction; do
            (cd "$m" && go mod tidy -diff && go mod verify)
          done

      # The chart ships its own copy of the CRDs; they are what a real install
      # applies. A stale copy prunes the field just as silently.
      - name: Chart CRDs match config/crd/bases
        run: |
          for f in dfaas.dfaas.io_environments.yaml dfaas.dfaas.io_loadtests.yaml; do
            diff -u "config/crd/bases/$f" "charts/dfaas/crds/$f"
          done

      # make test = manifests + generate + fmt + vet + envtest assets + go test
      # over `go list ./... | grep -v /e2e`. Never run ./test/e2e here: it
      # applies cert-manager and the prometheus-operator bundle to whatever
      # kubeconfig context is active, with no guard.
      - run: make test

      # A Dockerfile is source no Go check reads. Two real breakages got past
      # everything above: the operator image omitted internal/reach and
      # internal/syncchannel from its COPY list, and the exporter compiled
      # `go build main.go` after main.go was split into three files. Both built
      # a green branch that shipped nothing. Native arch only, no push -- this
      # gate is about whether the build succeeds, not about the artifact.
      - name: Images build
        run: |
          docker build -t dfaas-operator:ci .
          docker build -t dfaas-exporter:ci dataExporter
          docker build -t dfaas-imgproc:ci imageFunction

  # The exporter image is the one that moves with every change to the export
  # format, and the cluster pulls it by :latest. Publishing it from main makes
  # the merge the delivery, instead of a buildx run on a laptop that happens to
  # have Docker up. Deliberately only this image: the operator and imgproc
  # images still ship from release.yml on a v* tag, and the job above still
  # only *builds* all three, on every PR, as the Dockerfile gate.
  #
  # Consequence to keep in mind: :latest now means "current main" for the
  # exporter, not "last release". A fresh install of an older release pulls
  # unreleased exporter code unless it pins a version tag.
  publish-exporter:
    needs: test
    # test.yml runs on pull_request too; only a push to main publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch, like release.yml: the management cluster runs on arm64 on
      # the laptop and on amd64 elsewhere, and a single-arch image fails there
      # with "exec format error" only once the Job starts.
      - name: Build & push exporter image
        uses: docker/build-push-action@v7
        with:
          context: dataExporter
          file: dataExporter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/isired01/dfaas-exporter:latest
