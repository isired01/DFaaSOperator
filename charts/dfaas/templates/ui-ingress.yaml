{{- if and .Values.ui.enabled .Values.ui.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dfaas.fullname" . }}-ui
  namespace: {{ .Values.ui.namespace }}
  labels:
    {{- include "dfaas.ui.labels" . | nindent 4 }}
  {{- with .Values.ui.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ui.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ui.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ui.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dfaas.fullname" . }}-ui
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
