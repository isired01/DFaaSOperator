{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfaas.fullname" . }}-ui
  namespace: {{ .Values.ui.namespace }}
  labels:
    {{- include "dfaas.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "dfaas.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfaas.ui.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dfaas.ui.sa" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "dfaas.ui.image" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.port }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.ui.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{ toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
