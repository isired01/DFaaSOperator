{{- if .Values.operator.enabled }}
{{- if .Values.operator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dfaas.operator.sa" . }}
  namespace: {{ .Values.operator.namespace }}
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "dfaas.operator.labels" . | nindent 4 }}
---
{{- end }}
# Operator ClusterRole — keep in sync with config/rbac/role.yaml
# (regenerated by `make manifests` then copied here).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dfaas.fullname" . }}-operator
  labels:
    {{- include "dfaas.operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - namespaces
      - persistentvolumeclaims
      - secrets
      - serviceaccounts
      - services
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Cluster-wide events: the controllers emit warning Events on Environments in
  # any namespace (e.g. SSH-unreachable health warnings). The leader-election
  # Role below only grants events in the operator's own namespace.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["dfaas.dfaas.io"]
    resources: ["environments", "loadtests"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["dfaas.dfaas.io"]
    resources: ["environments/finalizers", "loadtests/finalizers"]
    verbs: ["update"]
  - apiGroups: ["dfaas.dfaas.io"]
    resources: ["environments/status", "loadtests/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "roles"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dfaas.fullname" . }}-operator
  labels:
    {{- include "dfaas.operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dfaas.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "dfaas.operator.sa" . }}
    namespace: {{ .Values.operator.namespace }}
---
# Leader election (namespaced).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dfaas.fullname" . }}-leader-election
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "dfaas.operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dfaas.fullname" . }}-leader-election
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "dfaas.operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dfaas.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "dfaas.operator.sa" . }}
    namespace: {{ .Values.operator.namespace }}
{{- end }}
