{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfaas.fullname" . }}-operator
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "dfaas.operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "dfaas.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfaas.operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dfaas.operator.sa" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "dfaas.operator.image" . }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElection.enabled }}
          env:
            - name: DFAAS_EXPORTER_IMAGE
              value: {{ include "dfaas.exporter.image" . }}
            # Last fallback for the VM-facing filer base (GO signal and
            # summary upload, http://<HOST_IP>:30901, SeaweedFS filer
            # NodePort) of a generator with no management address detected at
            # provisioning and no DFAAS_SYNC_PUBLIC_URL (operator.extraEnv).
            # Only those generators dial it, and they must reach it: on a lab
            # spread over several sites, HOST_IP is often a local bridge
            # address, so set DFAAS_SYNC_PUBLIC_URL to an address of the
            # management node that every generator can route to (for example a
            # VPN address) instead.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- with .Values.operator.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probe
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.operator.resources | nindent 12 }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
