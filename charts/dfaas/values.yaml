# Global
nameOverride: ""
fullnameOverride: ""

operator:
  enabled: true
  namespace: dfaas-operator-system
  replicas: 1
  image:
    repository: ghcr.io/isired01/dfaas-operator
    tag: ""                       # default = .Chart.AppVersion
    pullPolicy: IfNotPresent
  exporterImage:
    repository: ghcr.io/isired01/dfaas-exporter
    tag: ""                       # default = .Chart.AppVersion
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  metricsService:
    enabled: true
    port: 8080
  leaderElection:
    enabled: true
  extraEnv: []                    # list of {name, value}
                                  # DFAAS_SYNC_PUBLIC_URL: the GO-signal filer address handed to
                                  #   every k6 generator; default: http://<manager hostIP>:30901.
                                  #   Must be reachable from every generator — on a lab spread over
                                  #   several sites, that is the management node's tailnet IP, not a
                                  #   local bridge address.
  nodeSelector: {}
  tolerations: []
  affinity: {}

ui:
  enabled: true
  namespace: dfaas-ui
  replicas: 1
  image:
    repository: ghcr.io/isired01/dfaas-control-plane
    tag: ""                       # default = .Chart.AppVersion
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  service:
    # NodePort by default: the whole testbed is reached by node IP
    # (prometheus 30090, grafana 30300, seaweedfs 30900/30901) and the UI is
    # the one piece a human has to open. Set type: ClusterIP to opt out.
    type: NodePort
    port: 8082
    nodePort: 30800          # only honoured when type is NodePort; empty = random
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true
  ingress:
    enabled: false
    className: ""
    host: dfaas.local
    annotations: {}
    tls: []                       # list of {secretName, hosts: []}
  env:                            # free-form key→value, each rendered as a container env var
                                  # PORT is derived from ui.service.port — do not set it here
    CORS_ORIGINS: ""              # csv; empty = same-origin only
    # SEAWEEDFS_ENDPOINT: ""      # override gateway→SeaweedFS dial endpoint; default: auto
                                  #   (in-cluster → seaweedfs-all-in-one.monitoring.svc…:8333, dev → <nodeIP>:30900)
    # SEAWEEDFS_PUBLIC_URL: ""    # override the asset URL handed to k6; default: <nodeIP>:30900
                                  #   Must be reachable from every generator — on a lab spread over
                                  #   several sites, that is the management node's tailnet IP, not a
                                  #   local bridge address.
    # SEAWEEDFS_FILER_PUBLIC_URL: ""
                                  # override the base of the result links shown after a
                                  # LoadTest; default: <nodeIP>:30901 (filer NodePort)

# CRDs ship in the chart's crds/ directory, so `helm install` applies them for
# you. Helm never touches them again: `helm upgrade` does NOT update a CRD, and
# `helm uninstall` does NOT remove one. After upgrading to a chart whose schema
# changed, apply the new definitions by hand:
#
#   kubectl apply -f https://github.com/isired01/DFaaSOperator/releases/download/v<version>/dfaas.dfaas.io_environments.yaml
#   kubectl apply -f https://github.com/isired01/DFaaSOperator/releases/download/v<version>/dfaas.dfaas.io_loadtests.yaml
#
# (Both files are attached to every release, and live in config/crd/bases/ in a
# repo checkout.)

imagePullSecrets: []
