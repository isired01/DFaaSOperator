---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: environments.dfaas.dfaas.io
spec:
  group: dfaas.dfaas.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Environment is the schema for the federation infrastructure resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentSpec is the desired federation infrastructure.
            properties:
              nodes:
                description: |-
                  Nodes are the machines of the federation, keyed by nodeID. Each ipAddress
                  may appear once (one machine is one node); at most 50 nodes. Uniqueness
                  is checked within one Environment only.
                items:
                  description: |-
                    EnvironmentNode declares one machine in the federation. A dfaas-worker must
                    declare at least one function.
                  properties:
                    balancingStrategy:
                      description: |-
                        BalancingStrategy is the dfaas-agent strategy (AGENT_STRATEGY) of a
                        dfaas-worker; ignored on a k6-load-generator. Supported: staticstrategy,
                        alllocalstrategy, recalcstrategy (uses each function's maxRate) and
                        randomstrategy. nodemarginstrategy and rlagentstrategy pass validation
                        but are not supported by this platform.
                      enum:
                      - staticstrategy
                      - nodemarginstrategy
                      - recalcstrategy
                      - alllocalstrategy
                      - rlagentstrategy
                      - randomstrategy
                      type: string
                    capacity:
                      description: |-
                        NodeCapacity is a size label for a node. The operator sizes nothing with it:
                        on a dfaas-worker it becomes the node_type label of the node's Prometheus
                        scrape target, and so a label on its federated series and a column of the
                        exported metrics CSV.
                      enum:
                      - LOW
                      - MEDIUM
                      - HIGH
                      type: string
                    functions:
                      description: Functions to deploy on a dfaas-worker node.
                      items:
                        description: Function describes one OpenFaaS function deployed
                          on a dfaas-worker node.
                        properties:
                          execTimeout:
                            default: 5
                            description: ExecTimeout is the function watchdog's exec_timeout,
                              in seconds.
                            minimum: 1
                            type: integer
                          image:
                            description: |-
                              Image is the function's container image. Pin it by digest or an immutable
                              tag for a reproducible campaign.
                            type: string
                          maxInflight:
                            default: 400
                            description: |-
                              MaxInflight is the function watchdog's max_inflight: the concurrent
                              requests one replica accepts.
                            minimum: 1
                            type: integer
                          maxRate:
                            default: 100
                            description: |-
                              MaxRate is the per-function request rate cap (req/s) consumed by
                              recalcstrategy. Emitted as OpenFaaS label `dfaas.maxrate` at deploy.
                              Required for recalcstrategy; ignored by staticstrategy and
                              alllocalstrategy.
                            format: int32
                            minimum: 1
                            type: integer
                          name:
                            description: |-
                              Name is the OpenFaaS function name, invoked at /function/<name> on the
                              node's HAProxy entrypoint (NodePort 30080). Lowercase letters and digits
                              only.
                            pattern: ^[a-z0-9]+$
                            type: string
                          timeoutMs:
                            default: 6000
                            description: |-
                              TimeoutMs is the per-function timeout in milliseconds, deployed as the
                              OpenFaaS label dfaas.timeout_ms for the dfaas-agent.
                            minimum: 1
                            type: integer
                        required:
                        - execTimeout
                        - image
                        - maxInflight
                        - maxRate
                        - name
                        - timeoutMs
                        type: object
                      type: array
                    ipAddress:
                      description: |-
                        IPAddress is the address the operator reaches this machine on: SSH on :22
                        and, for a k6-load-generator, the k3s API on :6443. Unique within
                        spec.nodes.
                      maxLength: 45
                      type: string
                    nodeID:
                      description: |-
                        NodeID names the node: a lowercase DNS-1123 label, unique within
                        spec.nodes. It is embedded in Kubernetes object names (kubeconfig Secret
                        <env>-<nodeID>-kubeconfig, remote TestRuns, k6-log ConfigMaps).
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    password:
                      description: Password is the SSH password of Username.
                      type: string
                    role:
                      description: |-
                        NodeRole tags a node either as a DFaaS worker or as a k6 load generator
                        running its own k3s + k6-operator.
                      enum:
                      - dfaas-worker
                      - k6-load-generator
                      type: string
                    username:
                      description: |-
                        Username is the SSH user the operator logs in as. Username and Password
                        are stored in plain text in the spec.
                      type: string
                  required:
                  - capacity
                  - ipAddress
                  - nodeID
                  - password
                  - role
                  - username
                  type: object
                  x-kubernetes-validations:
                  - message: a dfaas-worker node must declare at least one function
                    rule: self.role != 'dfaas-worker' || (has(self.functions) && size(self.functions)
                      > 0)
                maxItems: 50
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - nodeID
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: 'each ipAddress must appear at most once: one machine is
                    one node'
                  rule: self.all(n, self.exists_one(m, m.ipAddress == n.ipAddress))
              s3ConfigRef:
                description: |-
                  S3ConfigRef points at a cluster-scoped S3 server configuration
                  registered in namespace "dfaas-s3" (Secret with label
                  "dfaas.io/s3-config=true"). When set, LoadTests targeting this
                  Environment export their metrics CSV to that S3 endpoint under a
                  bucket derived from the Environment name. When nil, LoadTests export
                  to the built-in in-cluster SeaweedFS sink ("seaweedfs-default"). The
                  Secret must hold the keys endpoint, region, access_key_id,
                  secret_access_key and force_path_style; every key except endpoint is
                  required by the exporter Job.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - nodes
            type: object
          status:
            description: EnvironmentStatus tracks the infrastructure phase observed
              by the controller.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dfaasNodes:
                description: DfaasNodes lists the nodeIDs of the dfaas-worker nodes.
                items:
                  type: string
                type: array
              k6Nodes:
                items:
                  description: |-
                    K6NodeStatus mirrors per-k6-machine connectivity info so the LoadTest
                    reconciler can resolve remote clusters without re-walking the spec.
                  properties:
                    ipAddress:
                      type: string
                    kubeconfigSecret:
                      type: string
                    managementAddress:
                      description: |-
                        ManagementAddress is the management node's address as this generator
                        sees it: the first field of $SSH_CONNECTION during the k6 playbook. The
                        playbook records it only when it is an IPv4 address (the generator's k3s
                        is single-stack, so its runner pods cannot dial IPv6) and the generator
                        could reach the filer NodePort with it (an HTTP answer, or connection
                        refused because SeaweedFS is installed later, in ProvisioningMonitoring),
                        and syncNodeStatus copies it from the kubeconfig Secret annotation
                        dfaas.io/management-address. The LoadTest reconciler builds every URL
                        this generator's runner dials back on it: the filer NodePort (summary
                        upload, GO signal) and the S3 NodePort (assets). Empty means not detected
                        (an older playbook, a generator reached over IPv6, detection failed, or
                        unverified): the filer URLs then fall back to DFAAS_SYNC_PUBLIC_URL, else
                        HOST_IP, and the runner gets no asset base.
                      maxLength: 45
                      type: string
                    nodeID:
                      type: string
                  required:
                  - ipAddress
                  - kubeconfigSecret
                  - nodeID
                  type: object
                type: array
              lastHealthCheck:
                description: |-
                  LastHealthCheck is the wall-clock time of the most recent Ready-state
                  SSH liveness probe round. Stamped each time the periodic check runs
                  while the Environment is Ready.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec.generation the last settled run (Ready or
                  Failed) applied, copied from provisioningGeneration at the settle. The
                  reconciler skips re-provisioning when metadata.generation ==
                  status.observedGeneration and phase == Ready.
                format: int64
                type: integer
              phase:
                description: EnvironmentPhase tracks the infrastructure lifecycle.
                enum:
                - ProvisioningVMs
                - ProvisioningInfra
                - ProvisioningMonitoring
                - Ready
                - Failed
                - Unreachable
                type: string
              provisioningGeneration:
                description: |-
                  ProvisioningGeneration is the metadata.generation the current (or last)
                  provisioning run is applying, recorded when the run starts
                  (ProvisioningVMs). A settled phase stamps it into observedGeneration, so
                  an edit that lands mid-run is detected as drift instead of being marked
                  installed without ever reaching Ansible.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
