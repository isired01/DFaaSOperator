---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: environments.dfaas.dfaas.io
spec:
  group: dfaas.dfaas.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Environment is the schema for the federation infrastructure resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentSpec is the desired federation infrastructure.
            properties:
              nodes:
                description: |-
                  Nodes is keyed by nodeID: the API server rejects duplicates at admission
                  (listType=map). Without it two entries sharing a nodeID collide on every
                  derived object name (kubeconfig Secret, libp2p key entry, remote TestRun)
                  and the second silently overwrites the first.

                  ipAddress is unique too, enforced by the CEL rule below: one physical
                  machine is one node. Two entries sharing an IP used to be valid (the
                  listMapKey only guards nodeID) and produced two libp2p identities on one
                  box — the Ansible run installs dfaas-agent twice with different keys, and
                  whichever lands last leaves every peer dialling a dead peer ID.
                  MaxItems is what makes the rule admissible at all: CEL cost estimation on
                  an unbounded array blows the schema budget (same reason nodeID uses an
                  OpenAPI Pattern instead of CEL), and this comparison is O(n²).
                  NOTE: scope is one Environment. Nothing stops two *different* Environments
                  from declaring the same machine — that needs a cross-object check the CRD
                  schema cannot express.
                items:
                  description: EnvironmentNode declares one machine in the federation.
                  properties:
                    balancingStrategy:
                      description: |-
                        BalancingStrategy is meaningful only for dfaas-worker nodes.
                        Accepted values are the canonical strategy names recognised by
                        dfaas-agent (AGENT_STRATEGY env var). Typos that look like
                        "alllocal" silently fall back to recalcstrategy and crash on
                        missing dfaas.maxrate, so the enum guard is the safety net.
                      enum:
                      - staticstrategy
                      - nodemarginstrategy
                      - recalcstrategy
                      - alllocalstrategy
                      - rlagentstrategy
                      type: string
                    capacity:
                      description: NodeCapacity expresses the relative CPU/RAM budget
                        of a node.
                      enum:
                      - LOW
                      - MEDIUM
                      - HIGH
                      type: string
                    functions:
                      description: Functions to deploy on a dfaas-worker node.
                      items:
                        description: Function describes one OpenFaaS function deployed
                          on a dfaas-worker node.
                        properties:
                          execTimeout:
                            default: 5
                            minimum: 1
                            type: integer
                          image:
                            type: string
                          maxInflight:
                            default: 400
                            minimum: 1
                            type: integer
                          maxRate:
                            default: 100
                            description: |-
                              MaxRate is the per-function request rate cap (req/s) consumed by
                              recalcstrategy. Emitted as OpenFaaS label `dfaas.maxrate` at deploy.
                              Required for recalcstrategy; ignored by staticstrategy and
                              alllocalstrategy.
                            format: int32
                            minimum: 1
                            type: integer
                          name:
                            description: |-
                              Name is templated by the dfaas-agent into HAProxy variable names
                              (`var(req.rate_local_func_<name>)`), and HAProxy variable names reject
                              hyphens. A single function called `dfaas-imgproc` therefore made HAProxy
                              refuse the WHOLE rendered config with a 400 from its Data Plane API —
                              "invalid syntax at char '-imgproc'" — so every worker kept serving the
                              placeholder 503 ("Proxy is running, but the DFaaS agent is not!") while
                              all seven Environment Conditions stayed green and the SSH probe was happy.
                              The name is also the OpenFaaS/DNS-1123 object name, which rejects
                              underscores, so the safe intersection is lowercase alphanumerics only.
                              Rejecting it here turns a silent data-plane death into an apply-time error.
                            pattern: ^[a-z0-9]+$
                            type: string
                          timeoutMs:
                            default: 6000
                            minimum: 1
                            type: integer
                        required:
                        - execTimeout
                        - image
                        - maxInflight
                        - maxRate
                        - name
                        - timeoutMs
                        type: object
                      type: array
                    ipAddress:
                      description: |-
                        MaxLength is not cosmetic: without it the CEL uniqueness rule on
                        spec.nodes below is rejected, because the cost estimator assumes the
                        largest string the request budget allows for every comparison. 45 is the
                        longest possible textual IP (IPv6 with an embedded IPv4, e.g.
                        ffff:...:255.255.255.255).
                      maxLength: 45
                      type: string
                    nodeID:
                      description: |-
                        NodeID must be DNS-1123 compatible (lowercase): it is embedded in
                        Kubernetes object names (kubeconfig Secret <env>-<nodeID>-kubeconfig,
                        remote TestRuns, k6-log ConfigMaps) — an uppercase ID makes the k6
                        Ansible Job's Secret push fail with a censored 422.
                        Pattern (not CEL XValidation): CEL cost estimation on unbounded
                        node arrays blows the schema budget; the OpenAPI pattern is free.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    password:
                      type: string
                    role:
                      description: |-
                        NodeRole tags a node either as a DFaaS worker or as a k6 load generator
                        running its own k3s + k6-operator.
                      enum:
                      - dfaas-worker
                      - k6-load-generator
                      type: string
                    username:
                      description: SSH credentials (inline, matches the FE-produced
                        manifests).
                      type: string
                  required:
                  - capacity
                  - ipAddress
                  - nodeID
                  - password
                  - role
                  - username
                  type: object
                maxItems: 50
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - nodeID
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: 'each ipAddress must appear at most once: one machine is
                    one node'
                  rule: self.all(n, self.exists_one(m, m.ipAddress == n.ipAddress))
              s3ConfigRef:
                description: |-
                  S3ConfigRef points at a cluster-scoped S3 server configuration
                  registered in namespace "dfaas-s3" (Secret with label
                  "dfaas.io/s3-config=true"). When set, LoadTests targeting this
                  Environment export their metrics CSV to that S3 endpoint under a
                  bucket derived from the Environment name. When nil, LoadTests export
                  to the built-in in-cluster SeaweedFS sink ("seaweedfs-default").
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              topology:
                description: |-
                  Topology declares inter-node network shaping (latency injection).

                  NOT IMPLEMENTED: the field is schema-only. Nothing in the operator or in the
                  Ansible playbooks reads it, so a declared link's latencyMs is never applied
                  to any node. It is kept so existing manifests still validate; treat it as
                  documentation of intent, not as a working feature.
                properties:
                  links:
                    items:
                      description: Link is one symmetric latency link in the topology.
                      properties:
                        latencyMs:
                          type: integer
                        nodeA:
                          type: string
                        nodeB:
                          type: string
                      required:
                      - latencyMs
                      - nodeA
                      - nodeB
                      type: object
                    type: array
                type: object
            required:
            - nodes
            type: object
          status:
            description: EnvironmentStatus tracks the infrastructure phase observed
              by the controller.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dfaasNodes:
                items:
                  type: string
                type: array
              k6Nodes:
                items:
                  description: |-
                    K6NodeStatus mirrors per-k6-machine connectivity info so the LoadTest
                    reconciler can resolve remote clusters without re-walking the spec.
                  properties:
                    ipAddress:
                      type: string
                    kubeconfigSecret:
                      type: string
                    nodeID:
                      type: string
                  required:
                  - ipAddress
                  - kubeconfigSecret
                  - nodeID
                  type: object
                type: array
              lastHealthCheck:
                description: |-
                  LastHealthCheck is the wall-clock time of the most recent Ready-state
                  SSH liveness probe round. Stamped each time the periodic check runs
                  while the Environment is Ready.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec.generation observed at the last
                  successful provisioning run. The reconciler skips re-provisioning when
                  metadata.generation == status.observedGeneration and phase == Ready.
                format: int64
                type: integer
              phase:
                description: EnvironmentPhase tracks the infrastructure lifecycle.
                enum:
                - Idle
                - ProvisioningVMs
                - ProvisioningInfra
                - ProvisioningMonitoring
                - Ready
                - Degraded
                - Failed
                - Unreachable
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
