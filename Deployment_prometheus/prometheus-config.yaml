apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-main-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s 

    scrape_configs:
      - job_name: 'federazione-dfaas'
        honor_labels: true # IMPORTANTE: mantiene le label originali del nodo edge
        metrics_path: '/federate'
        params:
          'match[]':
            - '{__name__=~".+"}' # Prendi TUTTE le metriche dal nodo remoto
        file_sd_configs:
          - files:
              - '/etc/prometheus/targets/*.json'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-targets
  namespace: monitoring
data: 
  # Qui l'operatore aggiungerà i file .json degli esperimenti
  placeholder.json: "[]"