apiVersion: dfaas.dfaas.io/v1
kind: Esperimento
metadata:
  name: test-milano-torino
spec:
  # 1. METRICHE DA OSSERVARE
  metriche:
    - query: "sum(irate(container_cpu_usage_seconds_total[1m]))"
      commento: "CPU totale consumata dai pod DFaaS"

  # 2. CONFIGURAZIONE DELLA FEDERAZIONE (I target fisici/VM)
  federazione:
    strategia: "NODE_MARGIN"
    nodi:
      - idNodo: "milano-edge-01" # Il tuo nodo principale
        indirizzoIP: "192.168.64.3" # Inserisci l'IP reale della prima VM
        tipoNodo: "MEDIUM"
        funzioni: ["image-proc", "face-det", "figlet"]
        idVicini:
          "torino-edge-02": 100

      - idNodo: "torino-edge-02"
        indirizzoIP: "192.168.64.5"
        tipoNodo: "LOW"
        funzioni: ["image-proc", "figlet"]

  # 3. PROFILO DI CARICO (Generato da k6 verso i nodi sopra)
  profiloCarico:
    commonHeaders: "'Content-Type':'text/plain'"
    scenari:
      - nomeScenario: "test-carico-principale"
        targetNodeID: "milano-edge-01" # Punta al primo nodo tramite ID
        nomeFunzioneTarget: "figlet"
        body: "test carico da venticinque"
        esecutore: "RAMPING_ARRIVAL_RATE"
        vuAllocati: 100
        startTime: 0
        stages:
          - durata: "30s"
            targetRps: 10
          - durata: "1m"
            targetRps: 50
          - durata: "30s"
            targetRps: 0
