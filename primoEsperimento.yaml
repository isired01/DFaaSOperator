apiVersion: dfaas.dfaas.io/v1
kind: Esperimento
metadata:
  name: test-milano-torino
spec:
  # 1. FEDERAZIONE
  federazione:
    strategia: "NODE_MARGIN"
    nodi:
      - idNodo: "milano-edge-01"
        indirizzoIP: "192.168.64.6"
        userName: "isaia"
        password: "root"
        capacita: "MEDIUM"
        funzioni:
          - nome: "shasum"
            immagine: "ghcr.io/openfaas/shasum:latest"
            execTimeout: 4
            maxInflight: 400
            timeoutMs: 6000

  # 2. TOPOLOGIA (Corrected indentation and structure)
  topologia:
    links:
      - nodoA: "milano-edge-01"
        nodoB: "torino-edge-01"
        latenzaMs: 54

  # 3. CONFIGURAZIONE CLEANUP
  isCleanupRequested: false
